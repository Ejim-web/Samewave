<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#102344">
<title>SameWave — 3D Social World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,Arial,sans-serif;background:#87c9ed;color:#fff}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:#fff;border:1px solid #ffffff30;background:#102344e8;border-radius:15px;padding:12px 14px;min-height:44px;box-shadow:0 5px 16px #00152a20;cursor:pointer}
button:active{transform:scale(.97)}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:0;right:0;padding:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
#brand{font-size:clamp(22px,5vw,31px);font-weight:900;letter-spacing:-1px;text-shadow:0 2px 10px #001b3c55}
#brand span{color:#ff3b91}
#tag{font-size:12px;color:#eef7ff;margin-top:2px}
#badge{pointer-events:auto;border-radius:30px;font-size:12px;padding:10px 13px;white-space:nowrap}
#location{position:absolute;top:105px;left:14px;background:#102344e8;padding:12px 15px;border-radius:16px;font-weight:700;font-size:14px;max-width:65%;line-height:1.5}
#location small{display:block;color:#bde8ff;font-weight:400}
#actions{position:absolute;right:12px;top:175px;display:flex;flex-direction:column;gap:8px;width:118px}
#actions button{text-align:left;font-size:13px;padding:10px 11px}
#hint{position:absolute;bottom:190px;left:50%;transform:translateX(-50%);background:#102344d9;padding:9px 13px;border-radius:25px;font-size:12px;white-space:nowrap}
#stick{position:absolute;left:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:136px;height:136px;border:2px solid #ffffff90;background:#ffffff30;border-radius:50%;touch-action:none}
#nub{position:absolute;left:42px;top:42px;width:50px;height:50px;border-radius:50%;background:#fff;border:3px solid #dcecf9;box-shadow:0 3px 12px #00152a50;pointer-events:none}
#quick{position:absolute;right:18px;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
#quick button{width:58px;height:58px;border-radius:50%;padding:0;font-size:25px;background:#ff3b91ed;border:2px solid #ffffff99}
#panel{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,360px);max-height:75vh;overflow:auto;background:#101d33f5;border:1px solid #ffffff35;border-radius:22px;padding:18px;box-shadow:0 20px 70px #00152a80}
#panel h2{margin:0 0 6px;font-size:22px}
#panel p{color:#c8d8ed;font-size:13px;line-height:1.5}
#panelGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
#panelGrid button{background:#ffffff12;text-align:left}
#close{width:100%;background:#ff3b91}
#toast{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:#102344ed;padding:12px 17px;border-radius:14px;display:none;max-width:85%;text-align:center;font-size:14px}
#status{position:absolute;left:50%;top:75px;transform:translateX(-50%);font-size:11px;color:#fff;background:#102344bd;padding:5px 9px;border-radius:20px;white-space:nowrap}
@media(min-width:700px){#stick{width:150px;height:150px}#nub{left:48px;top:48px}#actions{width:150px}#actions button{font-size:14px}}
</style>
<!-- Import map fixes the bare "three" import used by Three.js example modules. -->
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="game"></div>
<header id="top">
  <div><div id="brand">Same<span>Wave</span> 🌐</div><div id="tag">Your world. Your people. Your wavelength.</div></div>
  <button id="badge" onclick="openPanel('world')">🌍 3D WORLD</button>
</header>
<div id="location">📍 Sunset Island <small id="placeLabel">Explore · Meet · Make Friends</small></div>
<div id="status">Starting 3D world…</div>
<nav id="actions">
  <button id="walkBtn" onclick="toggleWalk()">🚶 Walk</button>
  <button onclick="openPanel('club')">🎵 Club</button>
  <button onclick="enterCar()">🚗 Drive</button>
  <button onclick="openPanel('hangout')">👥 Hang out</button>
  <button onclick="openPanel('house')">🏠 House</button>
  <button onclick="openPanel('more')">✨ More activities</button>
</nav>
<div id="hint">Drag the joystick to walk around</div>
<div id="stick" aria-label="Movement joystick"><div id="nub"></div></div>
<div id="quick">
  <button aria-label="Wave" onclick="act('wave')">👋</button>
  <button aria-label="Jump" onclick="act('jump')">⬆️</button>
  <button aria-label="Dance" onclick="act('dance')">💃</button>
</div>
<section id="panel">
  <h2 id="panelTitle">Activities</h2>
  <p id="panelDesc">Choose what you want to do in the world.</p>
  <div id="panelGrid"></div>
  <button id="close" onclick="closePanel()">Back to world</button>
</section>
<div id="toast" role="status"></div>

<script type="module">
import * as THREE from 'three';

const statusEl=document.getElementById('status');
const host=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bd1f3);
scene.fog=new THREE.Fog(0x8bd1f3,55,150);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,350);
camera.position.set(0,5,18);

let renderer;
try {
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=false; // Better performance on mobile phones.
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  host.appendChild(renderer.domElement);
} catch(error) {
  statusEl.textContent='3D graphics are unavailable in this browser';
  throw error;
}

scene.add(new THREE.HemisphereLight(0xe4f7ff,0x67854e,2.1));
const sun=new THREE.DirectionalLight(0xfff1d4,2.2);
sun.position.set(-20,35,15);
scene.add(sun);

const mat=(color,roughness=.82,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const grass=mat(0x8bcf77),roadmat=mat(0x7d8991),white=mat(0xf7f8fa),
wall=mat(0xf1d5c9),roof=mat(0xef9b70),leaf=mat(0x16834e),
trunk=mat(0x79543b),glass=mat(0x83d9f4,.3,.1),dark=mat(0x18263b),
skin=mat(0x985c3c),shirt=mat(0x202b3b),pants=mat(0x263b5a),
shoe=mat(0xf3f4f6),hair=mat(0x201b18);

function box(parent,w,h,d,m,x,y,z){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z);o.castShadow=false;o.receiveShadow=false;parent.add(o);return o;
}
function sphere(parent,r,m,x,y,z,sx=1,sy=1,sz=1){
  const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);
  o.position.set(x,y,z);o.scale.set(sx,sy,sz);parent.add(o);return o;
}
function ground(w,d,m,x=0,z=0){
  const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);
  o.rotation.x=-Math.PI/2;o.position.set(x,-.04,z);scene.add(o);return o;
}
ground(180,180,grass);
ground(180,16,roadmat,0,2);
ground(14,80,roadmat,3,-24);
for(let z=-80;z<80;z+=9)box(scene,.16,.025,4,white,0,.01,z+2);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(180,35),mat(0x35a8d1,.32));
sea.rotation.x=-Math.PI/2;sea.position.set(0,-.12,-85);scene.add(sea);

function house(x,z,paint=wall){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  box(g,5,3.1,4,paint,0,1.55,0);
  const r=new THREE.Mesh(new THREE.ConeGeometry(3.7,1.7,4),roof);
  r.position.set(0,3.95,0);r.rotation.y=Math.PI/4;r.scale.z=.85;g.add(r);
  box(g,.85,1.8,trunk,0,.9,2.04);
  for(const wx of [-1.5,1.5]){
    box(g,.85,.85,glass,wx,1.8,2.05);
    box(g,.9,.08,white,wx,1.8,2.1);
    box(g,.08,.9,white,wx,1.8,2.1);
  }
}
house(-11,-3);house(-14,-12,mat(0xd5e6e8));house(14,-13,mat(0xf0e2b2));

function building(x,z,w,d,color){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  box(g,w,4,d,mat(color),0,2,0);box(g,w+.2,.25,d+.2,mat(0x182944),0,4.1,0);
  for(let xw=-w/2+1;xw<w/2;xw+=2)box(g,1.2,2.1,.08,glass,xw,1.65,d/2+.05);
  box(g,w*.7,.65,.14,mat(0xff3b91),0,3.3,d/2+.1);
}
building(12,8,11,7,0x272b50);building(-12,8,9,7,0xe0c4a0);

function tree(x,z,s=1){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.24*s,1.6*s,8),trunk);t.position.y=.8*s;g.add(t);
  for(let i=0;i<3;i++)sphere(g,.72*s,leaf,0,(1.5+i*.55)*s,0,1,1.15,1);
}
for(let i=0;i<22;i++){
  const x=(i%2?1:-1)*(18+Math.random()*25),z=-35+Math.random()*65;
  if(Math.abs(z-2)>8)tree(x,z,.75+Math.random()*.55);
}

/* A built-in human avatar is created locally, so it appears even if external
   model websites fail. The face points toward the avatar's forward (-Z). */
function makePerson(opts={}){
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const sk=opts.skin||skin,top=opts.shirt||shirt,leg=opts.pants||pants,ha=opts.hair||hair;
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.62,5,10),top);
  torso.position.y=1.48;body.add(torso);
  sphere(body,.265,sk,0,2.25,0,1,.98,.92);
  sphere(body,.275,ha,0,2.47,-.025,1.06,.52,1);
  sphere(body,.105,ha,-.20,2.37,-.015,.9,.75,.9);
  sphere(body,.105,ha,.20,2.37,-.015,.9,.75,.9);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,.2,10),sk);
  neck.position.set(0,2.03,0);body.add(neck);
  const brow=mat(0x33231c);
  box(body,.085,.018,.02,brow,-.095,2.30,-.238);
  box(body,.085,.018,.02,brow,.095,2.30,-.238);
  sphere(body,.038,white,-.095,2.255,-.24,.8,1,.45);
  sphere(body,.038,white,.095,2.255,-.24,.8,1,.45);
  sphere(body,.018,dark,-.095,2.255,-.264);
  sphere(body,.018,dark,.095,2.255,-.264);
  sphere(body,.035,sk,0,2.17,-.255,.8,1,.7);
  const smile=new THREE.Mesh(new THREE.TorusGeometry(.055,.009,6,12,Math.PI),mat(0x4b2118));
  smile.position.set(0,2.12,-.25);smile.rotation.z=Math.PI;body.add(smile);
  const arms=[],legs=[];
  for(const side of [-1,1]){
    const arm=new THREE.Group();arm.position.set(side*.40,1.78,0);body.add(arm);
    const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.39,4,8),top);upper.position.y=-.23;arm.add(upper);
    const fore=new THREE.Mesh(new THREE.CapsuleGeometry(.085,.35,4,8),sk);fore.position.y=-.62;arm.add(fore);
    sphere(arm,.085,sk,0,-.83,0);arms.push(arm);
    const hip=new THREE.Group();hip.position.set(side*.17,1.02,0);body.add(hip);
    const thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.43,4,8),leg);thigh.position.y=-.25;hip.add(thigh);
    box(hip,.23,.14,.40,shoe,0,-.66,-.07);legs.push(hip);
  }
  root.userData={body,arms,legs};return root;
}

const player=makePerson({skin:mat(0x955a3c),shirt:mat(0x202b3b),pants:mat(0x263b5a)});
player.position.set(0,0,10);player.visible=true;scene.add(player);

const npcs=[];
for(let i=0;i<7;i++){
  const npc=makePerson({
    skin:mat([0x6e422e,0xb97950,0xd6a078,0x8d5438][i%4]),
    shirt:mat([0x346c9a,0x7b365f,0x36775b,0xd08c32][i%4]),
    pants:mat(0x293548),hair:mat([0x211a17,0x3b2b21,0x171515][i%3])
  });
  npc.position.set((i%2?1:-1)*(3+Math.random()*7),0,-2-Math.random()*13);
  npc.rotation.y=Math.PI;scene.add(npc);
  npcs.push({obj:npc,phase:Math.random()*7,origin:npc.position.clone()});
}

const car=new THREE.Group();car.position.set(4,0,12);scene.add(car);
box(car,2.15,.55,3.7,mat(0x17273d,.35,.25),0,.65,0);
box(car,1.55,.72,1.65,mat(0x3d9fc5,.28,.2),0,1.18,-.15);
box(car,1.5,.1,1.45,mat(0x17273d),0,1.57,-.15);
for(const x of [-1.05,1.05])for(const z of [-1.15,1.15]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.18,16),dark);
  w.rotation.z=Math.PI/2;w.position.set(x,.38,z);car.add(w);
}

let mode='walk',moveX=0,moveY=0,keys={},action='',actionUntil=0,walkClock=0,carSpeed=0,autoWalk=false;
const hint=document.getElementById('hint');
function toast(message){
  const t=document.getElementById('toast');t.textContent=message;t.style.display='block';
  clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200);
}
window.toggleWalk=()=>{
  autoWalk=!autoWalk;
  document.getElementById('walkBtn').textContent=autoWalk?'⏸ Stop walking':'🚶 Walk';
  toast(autoWalk?'🚶 Walking forward. Use the joystick to steer.':'You stopped walking.');
};
window.act=(a)=>{
  action=a;actionUntil=performance.now()+(a==='dance'?5000:a==='jump'?750:1300);
  if(a==='wave')toast('👋 You wave to people nearby!');
  if(a==='jump')toast('⬆️ Jump!');
  if(a==='dance')toast('💃 Dance time!');
};
window.enterCar=()=>{
  if(mode==='drive'){
    mode='walk';autoWalk=false;player.visible=true;carSpeed=0;
    document.getElementById('walkBtn').textContent='🚶 Walk';
    toast('You got out of the car.');
    hint.textContent='Drag the joystick to walk around';
    document.getElementById('placeLabel').textContent='Explore · Meet · Make Friends';
  }else{
    mode='drive';autoWalk=false;player.visible=false;
    car.position.set(player.position.x,0,player.position.z);
    car.rotation.y=player.rotation.y;
    toast('🚗 You entered the car. Use the joystick to drive.');
    hint.textContent='Joystick: steer and drive · Drive button: get out';
    document.getElementById('placeLabel').textContent='Driving · Sunset Island';
  }
};

const data={
 world:['Sunset Island','Explore the 3D island. This is currently a local single-player demo.',['🌴 Explore','🚶 Walk / run','👋 Wave','💃 Dance']],
 club:['Nightclub','Visit the club building and try dancing.',['🎵 Enter club','💃 Dance','👋 Meet people','↩️ Leave club']],
 hangout:['Hang out','Choose a social activity. Online multiplayer chat is not connected yet.',['☕ Get coffee','🪑 Sit and relax','👋 Wave to people','💬 Open chat (demo)']],
 house:['Your house','Visit a house area and choose a home activity.',['🏠 Visit house','🛋️ Relax','🎨 Decorate (demo)','↩️ Return outside']],
 more:['More activities','Explore more places around Sunset Island.',['🛍️ Visit shops','🏖️ Go to beach','🎡 Visit funfair','🎭 Change style']]
};
window.openPanel=(key)=>{
  const d=data[key]||data.more;
  document.getElementById('panelTitle').textContent=d[0];
  document.getElementById('panelDesc').textContent=d[1];
  const grid=document.getElementById('panelGrid');grid.innerHTML='';
  d[2].forEach(label=>{
    const b=document.createElement('button');b.textContent=label;
    b.onclick=()=>{
      closePanel();const low=label.toLowerCase();
      if(low.includes('dance'))act('dance');
      else if(low.includes('wave'))act('wave');
      else if(low.includes('club')){player.position.set(10,0,5);toast('Welcome to the club area!');}
      else if(low.includes('beach')){player.position.set(0,0,-72);toast('You arrived at the beach.');}
      else if(low.includes('house')){player.position.set(-10,0,-1);toast('You are near your house.');}
      else if(low.includes('coffee')){player.position.set(-9,0,5);toast('☕ You are hanging out by the cafe.');}
      else if(low.includes('funfair')){player.position.set(20,0,-20);toast('🎡 Funfair area selected.');}
      else if(low.includes('relax')||low.includes('sit')){action='sit';actionUntil=performance.now()+2000;toast('You relax for a moment.');}
      else toast(label+' selected (demo).');
    };
    grid.appendChild(b);
  });
  document.getElementById('panel').style.display='block';
};
window.closePanel=()=>document.getElementById('panel').style.display='none';

const stick=document.getElementById('stick'),nub=document.getElementById('nub');
let pointer=null;
function stickMove(e){
  autoWalk=false;document.getElementById('walkBtn').textContent='🚶 Walk';
  const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy,max=(r.width/2)-27,len=Math.hypot(dx,dy)||1;
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  nub.style.transform=`translate(${dx}px,${dy}px)`;
  moveX=dx/max;moveY=dy/max;
}
stick.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);stickMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)stickMove(e);});
function release(){pointer=null;moveX=0;moveY=0;nub.style.transform='translate(0,0)';}
stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function moveInput(){
  let x=moveX,y=(autoWalk?-1:moveY);
  if(keys.a||keys.arrowleft)x=-1;if(keys.d||keys.arrowright)x=1;
  if(keys.w||keys.arrowup)y=-1;if(keys.s||keys.arrowdown)y=1;
  const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}return{x,y};
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04),now=performance.now(),inp=moveInput();
  walkClock+=dt*7;
  if(mode==='walk'){
    const moving=Math.abs(inp.x)+Math.abs(inp.y)>.08;
    if(moving){
      const speed=(keys.shift?6.2:3.5)*dt;
      player.position.x+=inp.x*speed;player.position.z+=inp.y*speed;
      player.position.x=THREE.MathUtils.clamp(player.position.x,-78,78);
      player.position.z=THREE.MathUtils.clamp(player.position.z,-78,78);
      player.rotation.y=Math.atan2(-inp.x,-inp.y);
      player.userData.legs.forEach((l,i)=>{l.rotation.x=Math.sin(walkClock*(keys.shift?1.35:1)+i*Math.PI)*.62;});
      player.userData.arms.forEach((a,i)=>{a.rotation.x=Math.sin(walkClock*(keys.shift?1.35:1)+i*Math.PI+Math.PI)*.42;});
      player.userData.body.position.y=Math.abs(Math.sin(walkClock*2))*.035;
    }else{
      player.userData.legs.forEach(l=>l.rotation.x*=.72);
      player.userData.arms.forEach(a=>a.rotation.x*=.72);
      player.userData.body.position.y*=.7;
    }
    if(action==='jump'&&now<actionUntil)player.position.y=Math.max(0,Math.sin((actionUntil-now)/750*Math.PI)*1.1);
    else player.position.y=0;
    if(action==='wave'&&now<actionUntil)player.userData.arms[1].rotation.z=-1.6+Math.sin(now/100)*.35;
    else if(action==='dance'&&now<actionUntil){
      player.userData.body.rotation.y=Math.sin(now/150)*.28;
      player.userData.arms.forEach((a,i)=>a.rotation.z=Math.sin(now/130+i*Math.PI)*.8);
    }else if(action==='sit'&&now<actionUntil)player.userData.body.rotation.x=.22;
    else{
      player.userData.body.rotation.y*=.85;player.userData.body.rotation.x*=.85;
      player.userData.arms.forEach(a=>a.rotation.z*=.8);
    }
    if(now>actionUntil)action='';
  }else{
    carSpeed+=(inp.y<-.1?8:inp.y>.1?-5:0)*dt;
    carSpeed*=Math.pow(.93,dt*30);carSpeed=THREE.MathUtils.clamp(carSpeed,-4,12);
    car.rotation.y+=inp.x*dt*(.6+Math.abs(carSpeed)*.06);
    car.position.x+=-Math.sin(car.rotation.y)*carSpeed*dt;
    car.position.z+=-Math.cos(car.rotation.y)*carSpeed*dt;
    car.position.x=THREE.MathUtils.clamp(car.position.x,-78,78);
    car.position.z=THREE.MathUtils.clamp(car.position.z,-78,78);
  }
  npcs.forEach(n=>{
    n.phase+=dt*.6;
    n.obj.position.x=n.origin.x+Math.sin(n.phase)*.6;
    n.obj.position.z=n.origin.z+Math.cos(n.phase*.7)*.45;
    n.obj.rotation.y=Math.sin(n.phase*.5)*.5;
    n.obj.userData.legs.forEach((l,j)=>l.rotation.x=Math.sin(n.phase*2+j*Math.PI)*.12);
  });
  const target=mode==='drive'?car.position:player.position;
  const facing=mode==='drive'?car.rotation.y:player.rotation.y;
  const behind=mode==='drive'?8:7;
  const desired=new THREE.Vector3(
    target.x+Math.sin(facing)*behind,
    target.y+4.1,
    target.z+Math.cos(facing)*behind
  );
  camera.position.lerp(desired,1-Math.exp(-dt*4));
  camera.lookAt(target.x,target.y+1.15,target.z);
  renderer.render(scene,camera);
}
animate();
statusEl.textContent='3D world ready · human avatars active';

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
});
</script>
</body>
</html>
