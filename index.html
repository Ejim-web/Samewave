<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SameWave — Club Edition</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Arial,sans-serif;background:#87c9ed;color:#fff;user-select:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:#fff;border:1px solid #ffffff30;background:#102344e8;border-radius:15px;padding:12px 14px;min-height:44px;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.95)}
button:disabled{opacity:0.5;cursor:not-allowed}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:0;right:0;padding:14px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
#brand{font-size:clamp(22px,5vw,31px);font-weight:900;letter-spacing:-1px;text-shadow:0 2px 10px #001b3c55}
#brand span{color:#ff3b91}
#tag{font-size:12px;margin-top:2px}
#online{position:absolute;top:105px;left:14px;background:#102344e8;padding:10px 14px;border-radius:16px;font-weight:700;font-size:13px;z-index:10;pointer-events:none}
#online small{display:block;color:#bde8ff;font-weight:400;font-size:11px;margin-top:2px}
#hint{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:#102344d9;padding:9px 13px;border-radius:25px;font-size:12px;z-index:10;pointer-events:none;text-align:center;opacity:0.9;white-space:nowrap}
#actions{position:absolute;right:14px;top:105px;display:flex;flex-direction:column;gap:8px;z-index:10}
#actions button{background:#102344e8;border-radius:12px;font-size:13px;padding:10px 14px;text-align:left;font-weight:600}
#actions button:hover:not(:disabled){background:#ff3b91}
#chatPanel{display:none;position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(94vw,520px);max-height:60vh;background:#101d33f7;border:1px solid #ffffff35;border-radius:20px;padding:12px;z-index:50;box-shadow:0 20px 60px #00152a90;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translate(-50%, 100%)}to{transform:translate(-50%, 0)}}
#chatHeader{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:#bde8ff;align-items:center}
#chatMessages{height:30vh;overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.msg{padding:7px 11px;border-radius:14px;max-width:85%;word-wrap:break-word;font-size:14px;line-height:1.35}
.msg .who{font-size:10px;opacity:.65;display:block;margin-bottom:2px;font-weight:600}
.msg.mine{align-self:flex-end;background:#ff3b91}
.msg.other{align-self:flex-start;background:#2a3d5c}
.msg.system{align-self:center;background:#ffffff15;color:#bde8ff;font-style:italic;font-size:12px}
#chatForm{display:flex;gap:6px}
#chatInput{flex:1;background:#0b1626;border:1px solid #ffffff30;border-radius:12px;padding:11px 12px;color:#fff;font-size:14px;outline:none;font-family:inherit}
#chatInput:focus{border-color:#ff3b91}
#chatSend{background:#34c759;border:none;border-radius:12px;padding:0 18px;font-weight:700}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#102344,#0a1a33);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;overflow-y:auto}
#loginCard{background:#101d33f5;border:1px solid #ffffff30;border-radius:24px;padding:26px;max-width:400px;width:100%;text-align:center;box-shadow:0 10px 40px #00000080}
#loginCard h1{margin:0 0 4px;font-size:30px}
#loginCard h1 span{color:#ff3b91}
#loginCard p{color:#a8c4e0;font-size:13px;margin:4px 0 18px}
.input-group{text-align:left;margin-bottom:12px}
.input-group label{display:block;font-size:11px;color:#bde8ff;margin-bottom:4px;margin-left:4px;font-weight:600}
.input-group input{width:100%;background:#0b1626;border:1px solid #ffffff30;border-radius:14px;padding:14px;color:#fff;font-size:16px;outline:none;font-family:inherit}
.input-group input:focus{border-color:#ff3b91}
.btn-main{width:100%;margin-top:8px;background:#ff3b91;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800}
.btn-secondary{width:100%;margin-top:10px;background:#ffffff15;border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:600;color:#bde8ff}
#loginStatus{margin-top:14px;font-size:12px;color:#ff9c9c;min-height:16px}
#roomInfo{display:none;margin-top:16px;padding:14px;background:#0b1626;border-radius:14px;border:1px dashed #ff3b91;text-align:center}
#roomInfo small{display:block;color:#a8c4e0;font-size:11px;margin-bottom:6px}
#roomCode{font-size:26px;font-weight:900;letter-spacing:2px;color:#ff3b91;user-select:all}
#interactBtn{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);background:#34c759;color:#fff;font-size:16px;font-weight:800;padding:14px 28px;border-radius:30px;border:3px solid #fff;display:none;z-index:20;box-shadow:0 4px 20px #00000050;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-10px)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
<div id="game"></div>

<div id="login">
  <div id="loginCard">
    <h1>Same<span>Wave</span> 🌐</h1>
    <p>Point, click, and meet people</p>
    <div class="input-group">
      <label>Your Name</label>
      <input id="loginName" maxlength="16" placeholder="e.g. Chinedu" autocomplete="off">
    </div>
    <div class="input-group">
      <label>Room Code (leave blank to create)</label>
      <input id="loginRoom" maxlength="12" placeholder="e.g. SAME-1234" autocomplete="off" style="text-transform:uppercase">
    </div>
    <button class="btn-main" id="btnStart">Enter World</button>
    <div id="loginStatus"></div>
    <div id="roomInfo">
      <small>Share this code with friends:</small>
      <div id="roomCode">----</div>
      <button class="btn-secondary" onclick="copyCode()">Copy Code</button>
    </div>
  </div>
</div>

<div id="top">
  <div><div id="brand">Same<span>Wave</span> 🌐</div><div id="tag" id="locationTag">🌴 Outside</div></div>
</div>
<div id="online">🟢 <span id="onlineCount">1</span> online</div>
<div id="hint">Tap a button on the right to travel.</div>

<nav id="actions">
  <button id="btnClub" onclick="travelTo('club')">🎵 Go to Club</button>
  <button id="btnOutside" onclick="travelTo('outside')" disabled>🌴 Go Outside</button>
</nav>

<button id="interactBtn" onclick="openChat()">💬 Talk</button>

<div id="chatPanel">
  <div id="chatHeader">
    <span id="chatTarget">Public Chat</span>
    <button style="padding:4px 8px;min-height:auto;background:transparent;border:none;font-size:18px" onclick="closeChat()">✕</button>
  </div>
  <div id="chatMessages"></div>
  <form id="chatForm">
    <input id="chatInput" maxlength="200" placeholder="Say something..." autocomplete="off">
    <button id="chatSend" type="submit">Send</button>
  </form>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   NETWORKING VARIABLES
   ============================================================ */
let myPeer = null, myId = null, myName = 'Guest', currentRoom = 'outside';
const connections = {};
const remotePlayers = {};

/* ============================================================
   3D SCENE SETUP
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bd1f3);
scene.fog = new THREE.Fog(0x8bd1f3, 40, 120);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 350);
camera.position.set(0, 10, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe4f7ff, 0x67854e, 2.1));
const sun = new THREE.DirectionalLight(0xfff1d4, 2.2);
sun.position.set(-20, 35, 15); scene.add(sun);

const mat = (c, r = .82, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const white = mat(0xf7f8fa), glass = mat(0x83d9f4, .3, .1), dark = mat(0x18263b), shoe = mat(0xf3f4f6);

function box(p, w, h, d, m, x, y, z) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z); p.add(o); return o;
}
function sphere(p, r, m, x, y, z, sx = 1, sy = 1, sz = 1) {
  const o = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m);
  o.position.set(x, y, z); o.scale.set(sx, sy, sz); p.add(o); return o;
}
function ground(w, d, m, x = 0, y = -.04, z = 0) {
  const o = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
  o.rotation.x = -Math.PI / 2; o.position.set(x, y, z); scene.add(o); return o;
}

/* ============================================================
   BUILD THE TWO ZONES
   ============================================================ */
// --- OUTSIDE ZONE ---
const outsideGroup = new THREE.Group(); scene.add(outsideGroup);
const outsideFloor = ground(80, 80, mat(0x8bcf77), 0, -.04, 0); outsideGroup.add(outsideFloor);
const outsideRoad = ground(14, 40, mat(0x7d8991), 0, -.03, 0); outsideGroup.add(outsideRoad);

const clubBuild = new THREE.Group(); clubBuild.position.set(0, 0, -15); outsideGroup.add(clubBuild);
box(clubBuild, 16, 8, 10, mat(0x272b50), 0, 4, 0);
box(clubBuild, 18, 0.5, 12, mat(0x182944), 0, 8.2, 0);
box(clubBuild, 4, 4, 0.2, mat(0x111122), 0, 2, 5.05); 
box(clubBuild, 6, 1.5, 0.3, mat(0xff3b91), 0, 6, 5.1);
for(let i=0; i<5; i++) {
  const x = (i%2? 1:-1) * (10 + Math.random()*15);
  const z = -5 + Math.random()*20;
  const t = new THREE.Group(); t.position.set(x,0,z); outsideGroup.add(t);
  box(t, 0.4, 3, 0.4, mat(0x79543b), 0, 1.5, 0);
  sphere(t, 1.8, mat(0x16834e), 0, 4, 0, 1, 1.2, 1);
}

// --- INSIDE CLUB ZONE ---
const insideGroup = new THREE.Group(); scene.add(insideGroup);
insideGroup.visible = false;
const insideFloor = ground(30, 30, mat(0x1a1a24), 0, -.04, 0); insideGroup.add(insideFloor);
box(insideGroup, 32, 8, 0.5, mat(0x101018), 0, 4, -15); 
box(insideGroup, 32, 8, 0.5, mat(0x101018), 0, 4, 15);  
box(insideGroup, 0.5, 8, 32, mat(0x101018), -15, 4, 0); 
box(insideGroup, 0.5, 8, 32, mat(0x101018), 15, 4, 0);  
box(insideGroup, 32, 0.5, 32, mat(0x101018), 0, 8, 0);  
box(insideGroup, 12, 0.1, 12, mat(0xff3b91, 0.5), 0, 0, 0); 
const bar = new THREE.Group(); bar.position.set(-10, 0, -8); insideGroup.add(bar);
box(bar, 8, 1.5, 3, mat(0x4a2c2a), 0, 0.75, 0);
box(bar, 8.2, 0.2, 3.2, mat(0xffffff), 0, 1.55, 0);
for(let i=0; i<4; i++) box(bar, 0.3, 0.8, 0.3, mat(0x34c759), -3 + i*2, 1.9, 0);
const dj = new THREE.Group(); dj.position.set(0, 0, -14); insideGroup.add(dj);
box(dj, 10, 1.5, 3, mat(0x111111), 0, 0.75, 0);
box(dj, 2, 2, 1, mat(0xff3b91), 0, 2.5, 0);

/* ============================================================
   AVATARS
   ============================================================ */
function makePerson(opts = {}) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const sk = opts.skin || mat(0x955a3c), top = opts.shirt || mat(0x346c9a),
        leg = opts.pants || mat(0x263b5a), ha = opts.hair || mat(0x201b18);
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.34, .62, 5, 10), top);
  torso.position.y = 1.48; body.add(torso);
  sphere(body, .265, sk, 0, 2.25, 0, 1, .98, .92);
  sphere(body, .275, ha, 0, 2.47, -.025, 1.06, .52, 1);
  sphere(body, .105, ha, -.20, 2.37, -.015, .9, .75, .9);
  sphere(body, .105, ha, .20, 2.37, -.015, .9, .75, .9);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.09, .12, .2, 10), sk);
  neck.position.set(0, 2.03, 0); body.add(neck);
  const brow = mat(0x33231c);
  box(body, .085, .018, .02, brow, -.095, 2.30, -.238);
  box(body, .085, .018, .02, brow, .095, 2.30, -.238);
  sphere(body, .038, white, -.095, 2.255, -.24, .8, 1, .45);
  sphere(body, .038, white, .095, 2.255, -.24, .8, 1, .45);
  sphere(body, .018, dark, -.095, 2.255, -.264);
  sphere(body, .018, dark, .095, 2.255, -.264);
  sphere(body, .035, sk, 0, 2.17, -.255, .8, 1, .7);
  const smile = new THREE.Mesh(new THREE.TorusGeometry(.055, .009, 6, 12, Math.PI), mat(0x4b2118));
  smile.position.set(0, 2.12, -.25); smile.rotation.z = Math.PI; body.add(smile);
  const arms = [], legs = [];
  for (const side of [-1, 1]) {
    const arm = new THREE.Group(); arm.position.set(side*.40, 1.78, 0); body.add(arm);
    const upper = new THREE.Mesh(new THREE.CapsuleGeometry(.105, .39, 4, 8), top); upper.position.y = -.23; arm.add(upper);
    const fore = new THREE.Mesh(new THREE.CapsuleGeometry(.085, .35, 4, 8), sk); fore.position.y = -.62; arm.add(fore);
    sphere(arm, .085, sk, 0, -.83, 0); arms.push(arm);
    const hip = new THREE.Group(); hip.position.set(side*.17, 1.02, 0); body.add(hip);
    const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(.13, .43, 4, 8), leg); thigh.position.y = -.25; hip.add(thigh);
    box(hip, .23, .14, .40, shoe, 0, -.66, -.07); legs.push(hip);
  }
  root.userData = { body, arms, legs };
  root.userData.body.rotation.order = 'YXZ';
  
  const hitbox = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3, 1.5), new THREE.MeshBasicMaterial({visible: false}));
  hitbox.position.y = 1.5; root.add(hitbox);
  root.userData.hitbox = hitbox;
  return root;
}

function makeNameTag(name) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(16,35,68,0.85)';
  ctx.beginPath(); ctx.roundRect(6, 26, 500, 76, 38); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(name, 256, 64);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true }));
  spr.scale.set(2.2, 0.55, 1); spr.position.y = 3.3;
  return spr;
}

/* ============================================================
   PLAYER & TAXI
   ============================================================ */
const player = makePerson({ skin: mat(0x955a3c), shirt: mat(0x202b3b), pants: mat(0x263b5a) });
player.position.set(0, 0, 10); player.visible = false; scene.add(player);

const taxi = new THREE.Group(); scene.add(taxi); taxi.visible = false;
box(taxi, 2.2, 1.2, 4, mat(0xffd700), 0, 0.6, 0);
box(taxi, 1.8, 0.8, 2, mat(0x333333), 0, 1.5, 0.2);
for (const x of [-1.1, 1.1]) for (const z of [-1.2, 1.2]) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(.4, .4, .25, 16), dark);
  w.rotation.z = Math.PI/2; w.position.set(x, .4, z); taxi.add(w);
}

let targetPos = null; 
let currentZone = 'outside'; 
let selectedPeer = null;
let walkPhase = 0;
let taxiState = 'none'; // 'arriving', 'driving'
let taxiSpeed = 0;

/* ============================================================
   TRAVEL LOGIC (TAXI SYSTEM)
   ============================================================ */
window.travelTo = (zone) => {
  if (currentZone === zone || taxiState !== 'none') return;
  
  document.getElementById('btnClub').disabled = true;
  document.getElementById('btnOutside').disabled = true;
  document.getElementById('interactBtn').style.display = 'none';
  document.getElementById('hint').textContent = "Walking to the curb...";
  
  // Walk to the curb (z = 10)
  targetPos = { x: 4, z: 10, callback: () => {
    if (zone === 'club') {
      taxiState = 'arriving';
      taxi.position.set(4, 0, 30); // Start far away
      taxi.rotation.y = Math.PI; // Face -Z
      taxi.visible = true;
      taxiSpeed = 0;
      document.getElementById('hint').textContent = "Taxi arriving...";
    } else {
      // Inside club -> Leaving
      player.visible = false;
      taxi.position.set(4, 0, 10);
      taxi.rotation.y = 0; // Face +Z
      taxi.visible = true;
      taxiState = 'driving';
      taxiSpeed = 0;
      document.getElementById('hint').textContent = "Driving outside...";
      currentZone = 'transition';
      insideGroup.visible = false;
      outsideGroup.visible = true;
      broadcastState();
    }
  }};
};

/* ============================================================
   NETWORKING (PEERJS)
   ============================================================ */
const COLORS = [0x346c9a, 0x7b365f, 0x36775b, 0xd08c32, 0x9b4dca, 0xe04a4a, 0x2ab7a9, 0xe8a33d];
const SKINS = [0x955a3c, 0x6e422e, 0xb97950, 0xd6a078, 0x8d5438];
const rand = a => a[Math.floor(Math.random()*a.length)];

function addRemotePlayer(data) {
  if (remotePlayers[data.id]) return;
  const avatar = makePerson({ skin: mat(data.skin || rand(SKINS)), shirt: mat(data.shirt || rand(COLORS)) });
  avatar.userData.hitbox.userData.peerId = data.id;
  avatar.userData.hitbox.userData.name = data.name;
  avatar.add(makeNameTag(data.name));
  scene.add(avatar);
  remotePlayers[data.id] = {
    avatar, target: { x: data.x, z: data.z }, zone: data.zone,
    action: '', walkClock: 0, name: data.name
  };
  updateVisibility(); updateOnlineCount();
}

function updateRemotePlayer(data) {
  const rp = remotePlayers[data.id];
  if (!rp) return;
  rp.target.x = data.x; rp.target.z = data.z; rp.zone = data.zone; rp.action = data.action || '';
}

function removePeer(id) {
  if (remotePlayers[id]) {
    scene.remove(remotePlayers[id].avatar);
    delete remotePlayers[id];
    updateOnlineCount();
    if (selectedPeer === id) closeChat();
  }
  delete connections[id];
}

function updateOnlineCount() {
  let count = 1;
  for (const id in remotePlayers) if (remotePlayers[id].zone === currentZone) count++;
  document.getElementById('onlineCount').textContent = count;
}

function updateVisibility() {
  for (const id in remotePlayers) {
    remotePlayers[id].avatar.visible = (remotePlayers[id].zone === currentZone);
  }
}

function connectToPeer(peerId, name) {
  if (connections[peerId]) return;
  const conn = myPeer.connect(peerId, { metadata: { name } });
  conn.on('open', () => {
    connections[peerId] = conn;
    conn.send({ type: 'join', id: myId, name: myName, x: player.position.x, z: player.position.z, zone: currentZone, skin: 0x955a3c, shirt: 0x346c9a });
  });
  conn.on('data', (data) => handleData(peerId, data));
  conn.on('close', () => removePeer(peerId));
}

function handleData(peerId, data) {
  if (data.type === 'join') {
    if (!remotePlayers[peerId]) {
      addRemotePlayer(data);
      if (connections[peerId]) {
        connections[peerId].send({ type: 'join', id: myId, name: myName, x: player.position.x, z: player.position.z, zone: currentZone, skin: 0x955a3c, shirt: 0x346c9a });
      }
    }
  } 
  else if (data.type === 'move') {
    updateRemotePlayer({ id: peerId, x: data.x, z: data.z, zone: data.zone, action: data.action });
    updateVisibility();
  }
  else if (data.type === 'chat') {
    addMessage(data.name, data.message, false);
    if (remotePlayers[peerId]) showSpeechBubble(remotePlayers[peerId].avatar, data.message);
  }
}

function broadcastState() {
  for (const id in connections) {
    if (connections[id].open) {
      connections[id].send({ type: 'move', x: player.position.x, z: player.position.z, zone: currentZone, action: '' });
    }
  }
}

function showSpeechBubble(avatar, text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 200;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.roundRect(10, 10, 492, 150, 26); ctx.fill();
  ctx.beginPath(); ctx.moveTo(240,160); ctx.lineTo(272,160); ctx.lineTo(256,185); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#102344'; ctx.font = 'bold 32px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const words = text.split(' '); let line = '', lines = [];
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > 460 && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  const startY = 85 - (lines.length - 1) * 20;
  lines.slice(0, 3).forEach((l, i) => ctx.fillText(l, 256, startY + i * 40));
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.scale.set(2.4, 0.95, 1); spr.position.y = 4.0;
  avatar.add(spr);
  setTimeout(() => { avatar.remove(spr); spr.material.map.dispose(); spr.material.dispose(); }, 4000);
}

/* ============================================================
   CLICK TO WALK & CLICK TO TALK
   ============================================================ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (!player.visible || taxiState !== 'none') return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  
  const clickableObjects = [];
  for (const id in remotePlayers) {
    if (remotePlayers[id].zone === currentZone) {
      clickableObjects.push(remotePlayers[id].avatar.userData.hitbox);
    }
  }
  
  const intersects = raycaster.intersectObjects(clickableObjects);
  
  if (intersects.length > 0) {
    const hit = intersects[0].object;
    const peerId = hit.userData.peerId;
    const rp = remotePlayers[peerId];
    
    if (rp) {
      document.getElementById('hint').textContent = "Walking to " + rp.name + "...";
      document.getElementById('interactBtn').style.display = 'none';
      
      const dx = rp.avatar.position.x - player.position.x;
      const dz = rp.avatar.position.z - player.position.z;
      const dist = Math.hypot(dx, dz);
      const stopX = rp.avatar.position.x - (dx/dist) * 1.8;
      const stopZ = rp.avatar.position.z - (dz/dist) * 1.8;
      
      targetPos = { 
        x: stopX, z: stopZ, 
        callback: () => {
          selectedPeer = peerId;
          document.getElementById('hint').textContent = "You are near " + rp.name;
          document.getElementById('interactBtn').style.display = 'block';
          targetPos = null;
        } 
      };
    }
  } else {
    const activeGroup = currentZone === 'club' ? insideGroup : outsideGroup;
    const hitFloor = raycaster.intersectObjects(activeGroup.children, true);
    if (hitFloor.length > 0 && hitFloor[0].point.y < 0.5) {
      let px = hitFloor[0].point.x;
      let pz = hitFloor[0].point.z;
      
      if (currentZone === 'club') {
        px = THREE.MathUtils.clamp(px, -13, 13);
        pz = THREE.MathUtils.clamp(pz, -13, 13);
      } else {
        px = THREE.MathUtils.clamp(px, -25, 25);
        pz = THREE.MathUtils.clamp(pz, -10, 25);
      }
      
      targetPos = { x: px, z: pz, callback: () => { targetPos = null; } };
      document.getElementById('hint').textContent = "Walking...";
      document.getElementById('interactBtn').style.display = 'none';
      selectedPeer = null;
    }
  }
});

/* ============================================================
   CHAT SYSTEM
   ============================================================ */
const chatPanel = document.getElementById('chatPanel');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');

window.openChat = () => {
  if (!selectedPeer || !remotePlayers[selectedPeer]) {
    document.getElementById('hint').textContent = "Walk close to someone first.";
    return;
  }
  const rp = remotePlayers[selectedPeer];
  document.getElementById('chatTarget').textContent = "Chatting with " + rp.name;
  chatPanel.style.display = 'block';
  document.getElementById('hint').textContent = "Type your message below.";
  setTimeout(() => chatInput.focus(), 100);
};

window.closeChat = () => {
  chatPanel.style.display = 'none';
  chatInput.blur();
  selectedPeer = null;
  document.getElementById('interactBtn').style.display = 'none';
  document.getElementById('hint').textContent = "Tap players to talk. Tap floor to walk.";
};

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addMessage(name, text, mine) {
  const el = document.createElement('div');
  el.className = 'msg ' + (mine ? 'mine' : 'other');
  el.innerHTML = `<span class="who">${escapeHtml(name)}</span>${escapeHtml(text)}`;
  chatMessages.appendChild(el);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  while (chatMessages.children.length > 80) chatMessages.removeChild(chatMessages.firstChild);
}
function addSystemMessage(t) {
  const el = document.createElement('div');
  el.className = 'msg system'; el.textContent = t;
  chatMessages.appendChild(el);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

document.getElementById('chatForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = chatInput.value.trim();
  if (!t) return;
  
  addMessage(myName, t, true);
  
  if (selectedPeer && connections[selectedPeer] && connections[selectedPeer].open) {
    connections[selectedPeer].send({ type: 'chat', name: myName, message: t });
  }
  chatInput.value = '';
});

/* ============================================================
   LOGIN & JOIN
   ============================================================ */
const loginEl = document.getElementById('login');
const loginName = document.getElementById('loginName');
const loginRoom = document.getElementById('loginRoom');
const loginStatus = document.getElementById('loginStatus');
const roomInfo = document.getElementById('roomInfo');
const roomCodeEl = document.getElementById('roomCode');

document.getElementById('btnStart').onclick = () => {
  const name = loginName.value.trim() || 'Guest';
  let room = loginRoom.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  
  if (!room) room = 'SAME-' + Math.floor(1000 + Math.random() * 9000);
  else if (!room.startsWith('SAME-')) room = 'SAME-' + room;
  
  myName = name;
  loginStatus.textContent = 'Connecting...';
  loginStatus.style.color = '#fff';
  roomCodeEl.textContent = room;

  if (myPeer) myPeer.destroy();
  myPeer = new Peer(room);
  
  myPeer.on('open', (id) => {
    myId = id;
    loginStatus.textContent = 'Connected!';
    loginStatus.style.color = '#34c759';
    
    if (!loginRoom.value.trim()) {
      roomInfo.style.display = 'block';
      setTimeout(() => {
        loginEl.style.display = 'none';
        player.visible = true;
        player.position.set(0, 0, 10);
      }, 1800);
    } else {
      loginEl.style.display = 'none';
      player.visible = true;
      player.position.set(0, 0, 10);
      connectToPeer(room, name);
    }
  });

  myPeer.on('connection', (conn) => {
    connections[conn.peer] = conn;
    conn.on('open', () => {
      conn.send({ type: 'join', id: myId, name: myName, x: player.position.x, z: player.position.z, zone: currentZone, skin: 0x955a3c, shirt: 0x346c9a });
    });
    conn.on('data', (d) => handleData(conn.peer, d));
    conn.on('close', () => removePeer(conn.peer));
  });

  myPeer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      myPeer = new Peer();
      myPeer.on('open', (id) => {
        myId = id;
        loginEl.style.display = 'none';
        player.visible = true;
        player.position.set(0, 0, 10);
        connectToPeer(room, name);
      });
      myPeer.on('connection', (conn) => {
        connections[conn.peer] = conn;
        conn.on('open', () => {
          conn.send({ type: 'join', id: myId, name: myName, x: player.position.x, z: player.position.z, zone: currentZone, skin: 0x955a3c, shirt: 0x346c9a });
        });
        conn.on('data', (d) => handleData(conn.peer, d));
        conn.on('close', () => removePeer(conn.peer));
      });
    } else {
      loginStatus.textContent = 'Error: ' + err.type;
      loginStatus.style.color = '#ff9c9c';
    }
  });
};

window.copyCode = () => {
  const code = roomCodeEl.textContent;
  navigator.clipboard.writeText(code).then(() => {
    loginStatus.textContent = 'Copied!';
    loginStatus.style.color = '#34c759';
  });
};

/* ============================================================
   GAME LOOP (MOVEMENT, TAXI, CAMERA, ANIMATION)
   ============================================================ */
const clock = new THREE.Clock();
let cameraTarget = new THREE.Vector3(0, 0, 10); // What the camera is looking at

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);

  // --- TAXI LOGIC ---
  if (taxiState === 'arriving') {
    // Drive towards Z = 10
    const dz = 10 - taxi.position.z;
    if (Math.abs(dz) > 0.5) {
      taxiSpeed += 10 * dt;
      taxi.position.z += Math.min(taxiSpeed * dt, Math.abs(dz)) * Math.sign(dz);
    } else {
      // Arrived at player
      taxi.position.z = 10;
      taxiState = 'none';
      player.visible = false; // Player enters car
      
      // Wait 0.5s then drive to club
      setTimeout(() => {
        taxiState = 'driving';
        taxiSpeed = 0;
        document.getElementById('hint').textContent = "Driving to club...";
        currentZone = 'transition';
        broadcastState();
      }, 500);
    }
  } 
  else if (taxiState === 'driving') {
    // Determine destination based on current zone
    const destZ = currentZone === 'transition' ? -15 : 30;
    const dz = destZ - taxi.position.z;
    
    if (Math.abs(dz) > 0.5) {
      taxiSpeed += 12 * dt;
      taxi.position.z += Math.min(taxiSpeed * dt, Math.abs(dz)) * Math.sign(dz);
    } else {
      // Arrived at destination
      taxi.position.z = destZ;
      taxiState = 'none';
      taxi.visible = false;
      
      if (currentZone === 'transition') { // We just arrived at the club
        currentZone = 'club';
        outsideGroup.visible = false;
        insideGroup.visible = true;
        player.position.set(0, 0, 12);
        player.visible = true;
        document.getElementById('locationTag').textContent = "🎵 Inside Club";
        document.getElementById('hint').textContent = "Welcome to the club! Tap people to talk.";
        
        document.getElementById('btnClub').disabled = true;
        document.getElementById('btnOutside').disabled = false;
        targetPos = { x: 0, z: 4, callback: () => { targetPos = null; } };
      } else { // We just arrived outside
        currentZone = 'outside';
        player.position.set(4, 0, 10);
        player.visible = true;
        document.getElementById('locationTag').textContent = "🌴 Outside";
        document.getElementById('hint').textContent = "Tap a button on the right to travel.";
        
        document.getElementById('btnClub').disabled = false;
        document.getElementById('btnOutside').disabled = true;
        targetPos = { x: 4, z: 8, callback: () => { targetPos = null; } };
      }
      broadcastState();
    }
  }

  // --- PLAYER MOVEMENT ---
  if (player.visible) {
    if (targetPos) {
      const dx = targetPos.x - player.position.x;
      const dz = targetPos.z - player.position.z;
      const dist = Math.hypot(dx, dz);
      
      if (dist > 0.1) {
        const speed = 4 * dt;
        player.position.x += (dx / dist) * speed;
        player.position.z += (dz / dist) * speed;
        
        const ta = Math.atan2(dx, dz);
        const diff = ((ta - player.rotation.y + Math.PI) % (Math.PI*2)) - Math.PI;
        player.rotation.y += diff * Math.min(1, dt*10);
        
        walkPhase += dt * 12;
        player.userData.legs.forEach((l,i) => l.rotation.x = Math.sin(walkPhase + i*Math.PI)*0.6);
        player.userData.arms.forEach((a,i) => a.rotation.x = Math.sin(walkPhase + i*Math.PI + Math.PI)*0.4);
        player.userData.body.position.y = Math.abs(Math.sin(walkPhase*2))*0.04;
      } else {
        player.position.x = targetPos.x;
        player.position.z = targetPos.z;
        player.userData.legs.forEach(l => l.rotation.x *= 0.8);
        player.userData.arms.forEach(a => a.rotation.x *= 0.8);
        player.userData.body.position.y *= 0.7;
        if (targetPos.callback) targetPos.callback();
      }
    } else {
      player.userData.legs.forEach(l => l.rotation.x *= 0.8);
      player.userData.arms.forEach(a => a.rotation.x *= 0.8);
      player.userData.body.position.y *= 0.7;
    }
  }

  // --- REMOTE PLAYERS ---
  for (const id in remotePlayers) {
    const rp = remotePlayers[id], a = rp.avatar;
    if (!a.visible) continue;
    
    const dx = rp.target.x - a.position.x;
    const dz = rp.target.z - a.position.z;
    
    if (Math.abs(dx) + Math.abs(dz) > 0.1) {
      a.position.x += dx * Math.min(1, dt*8);
      a.position.z += dz * Math.min(1, dt*8);
      
      const ta = Math.atan2(dx, dz);
      const rd = ((ta - a.rotation.y + Math.PI) % (Math.PI*2)) - Math.PI;
      a.rotation.y += rd * Math.min(1, dt*10);
      
      rp.walkClock += dt * 10;
      a.userData.legs.forEach((l,i) => l.rotation.x = Math.sin(rp.walkClock + i*Math.PI)*0.6);
      a.userData.arms.forEach((ar,i) => ar.rotation.x = Math.sin(rp.walkClock + i*Math.PI + Math.PI)*0.4);
    } else {
      a.userData.legs.forEach(l => l.rotation.x *= 0.8);
      a.userData.arms.forEach(ar => ar.rotation.x *= 0.8);
    }
  }

  // --- CAMERA FOLLOW LOGIC ---
  if (taxiState === 'arriving' || taxiState === 'driving') {
    // Follow the taxi
    cameraTarget.lerp(taxi.position, 0.1);
  } else if (player.visible) {
    // Follow the player
    cameraTarget.lerp(player.position, 0.1);
  }
  
  // Position camera relative to the target
  const camX = cameraTarget.x;
  const camY = 12;
  const camZ = cameraTarget.z + 16;
  
  camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.1);
  camera.lookAt(cameraTarget.x, cameraTarget.y + 1.5, cameraTarget.z);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
